<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이링크 - 나만의 링크 페이지</title>
  <style>
    body { margin: 0; padding: 60px 20px; font-family: sans-serif; background: #f5f3ff; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 380px; background: white; border-radius: 20px; padding: 36px 24px; text-align: center; box-shadow: 0 10px 25px rgba(91,95,199,0.1); }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: #5B5FC7; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 0 0 8px; color: #1f2937; }
    p { font-size: 14px; color: #6b7280; margin: 0 0 28px; }
    .btn { display: block; padding: 14px; margin-bottom: 12px; background: #5B5FC7; color: white; text-decoration: none; border-radius: 12px; font-weight: 600; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">ML</div>
    <h1>나의 마이링크</h1>
    <p>나만의 링크 페이지를 한곳에 모았습니다.</p>
    <a class="btn" href="https://github.com/" target="_blank">GitHub 바로가기</a>
    <a class="btn" href="https://www.google.com/" target="_blank">포트폴리오 페이지</a>
    <a class="btn" href="https://www.naver.com/" target="_blank">블로그 바로가기</a>
  </div>
</body>
</html>
